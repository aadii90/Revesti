backend:
  name: github
  repo: aadii90/revesti
  branch: main
  base_url: https://api.netlify.com
  commit_messages:
    create: "Nuovo {{collection}}: {{slug}}"
    update: "Modifica {{collection}}: {{slug}}"
    delete: "Elimina {{collection}}: {{slug}}"
    uploadMedia: "Carica foto {{path}}"
    deleteMedia: "Elimina foto {{path}}"

locale: it
site_url: /
display_url: /
logo_url: ""

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: prodotti
    label: Prodotti
    label_singular: Prodotto
    description: Ogni prodotto salvato appare sul sito in circa un minuto.
    folder: content/prodotti
    create: true
    delete: true
    format: json
    extension: json
    slug: "{{slug}}"
    summary: "{{nome}} · {{reparto}} · € {{prezzo}}"
    sortable_fields: [nome, reparto, prezzo, data]
    view_groups:
      - { label: Reparto, field: reparto }
    fields:
      - { label: Nome, name: nome, widget: string }
      - label: Reparto
        name: reparto
        widget: relation
        collection: impostazioni
        file: reparti
        search_fields: ["reparti.*.nome"]
        value_field: "reparti.*.nome"
        display_fields: ["reparti.*.nome"]
        hint: Per aggiungere un reparto vai in Impostazioni → Reparti.
      - { label: "Prezzo (€)", name: prezzo, widget: number, value_type: float, min: 0, step: 0.5 }
      - { label: "Prezzo pieno (€)", name: prezzo_pieno, widget: number, value_type: float, min: 0, required: false, hint: "Facoltativo. Se è più alto del prezzo, sul sito appare barrato con lo sconto." }
      - { label: Taglie, name: taglie, widget: list, required: false, hint: "Separate da virgola, es. S, M, L oppure 4A, 6A" }
      - { label: Foto principale, name: foto, widget: image, required: false, choose_url: false }
      - label: Altre foto
        name: altre_foto
        widget: list
        required: false
        field: { label: Foto, name: foto, widget: image, choose_url: false }
      - { label: Descrizione, name: descrizione, widget: text, required: false, hint: "Condizioni del capo, materiale, misure, difetti." }
      - { label: Mostra in vetrina, name: attivo, widget: boolean, default: true }
      - { label: Data inserimento, name: data, widget: datetime, required: false, hint: "I prodotti più recenti appaiono per primi." }

  - name: impostazioni
    label: Impostazioni
    editor: { preview: false }
    files:
      - name: negozio
        label: Dati del negozio
        file: data/negozio.json
        fields:
          - { label: Nome negozio, name: nome, widget: string }
          - { label: Titolo vetrina, name: titolo, widget: string }
          - { label: Sottotitolo, name: sottotitolo, widget: text, required: false }
          - { label: WhatsApp per ordini, name: whatsapp, widget: string, hint: "Con prefisso internazionale e senza spazi, es. 393298813703" }
          - { label: Email per ordini, name: email, widget: string, required: false }
      - name: reparti
        label: Reparti
        file: data/reparti.json
        fields:
          - label: Reparti
            name: reparti
            widget: list
            label_singular: reparto
            summary: "{{fields.nome}}"
            hint: "Trascina per cambiare l'ordine. Se rinomini un reparto, aggiorna anche i prodotti che lo usano."
            fields:
              - { label: Nome, name: nome, widget: string }
